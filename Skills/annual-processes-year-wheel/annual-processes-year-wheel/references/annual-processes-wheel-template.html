<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Annual Processes Year Wheel – Sample</title>
<!-- TEMPLATE PART 1: CSS. Copy this <style> block verbatim into the generated page. -->
<style>.aw{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,36px);background:#f7f8f5;border-radius:22px;color:#22332f;font-family:"Segoe UI",sans-serif}
.aw-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:18px;border-bottom:1px solid #dfe6e1}
.aw-eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:#53716a}
.aw-head h1{font:clamp(32px,4.6vw,52px)/1.05 Georgia,serif;color:#183a35;margin:8px 0}
.aw-head p{margin:0;color:#65736d;font-size:15px;max-width:640px}
.aw-today{display:grid;justify-items:end;line-height:1.1}.aw-today span{font-size:10px;letter-spacing:.16em;color:#c0453a;font-weight:800}.aw-today strong{font:26px Georgia,serif;color:#183a35;margin:4px 0}.aw-today small{color:#65736d}
.aw-how{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:16px 0 4px;padding:12px 16px;background:#fff;border:1px solid #e3e9e5;border-radius:12px;font-size:12.5px;color:#41544e}
.aw-how b{color:#183a35;margin-right:4px}.aw-how span{display:inline-flex;align-items:center;gap:7px}
.aw-how i{display:inline-block}.k-arc{width:22px;height:8px;border-radius:4px;background:#2f6f62}.k-ring{width:14px;height:14px;border-radius:50%;border:4px solid #c0803a;opacity:.5}.k-today{width:3px;height:14px;background:#c0453a}.k-dot{width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #183a35}.k-month{width:18px;height:12px;border-radius:3px;background:#183a35}
.aw-ctr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 0}
.aw-ctr input,.aw-ctr select{border:1px solid #d5dfd9;border-radius:9px;background:#fff;padding:9px 12px;font:inherit;color:#22332f}.aw-ctr input{min-width:220px}
.aw-btn{border:1px solid #183a35;background:#183a35;color:#fff;border-radius:9px;padding:9px 14px;font:600 13px "Segoe UI",sans-serif;cursor:pointer}.aw-btn.ghost{background:#fff;color:#183a35;border-color:#d5dfd9;margin-left:auto}
.aw-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.aw-kpi{background:#fff;border:1px solid #e3e9e5;border-radius:14px;padding:14px 16px;display:grid;gap:2px}.aw-kpi span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#53716a;font-weight:700}.aw-kpi strong{font:38px/1.1 Georgia,serif;color:#183a35}.aw-kpi small{color:#65736d}
.aw-next{margin:16px 0}.aw-next h2{font:600 13px "Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#53716a;margin:0 0 8px}
.aw-next-track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.aw-nx{background:#fff;border:1px solid #e3e9e5;border-top:4px solid #2f6f62;border-radius:12px;padding:10px 12px;display:grid;gap:3px;cursor:pointer}.aw-nx .dt{font-size:11px;color:#65736d}.aw-nx b{font-size:13.5px;color:#183a35;line-height:1.25}.aw-nx small{color:#65736d;font-size:12px}.aw-nx em{font-style:normal;font-weight:700;color:#c0453a;font-size:12px}
.aw-body{display:grid;grid-template-columns:minmax(340px,1.35fr) minmax(280px,.85fr);gap:24px;align-items:start}
.aw-wheel{position:relative;background:#fff;border:1px solid #e3e9e5;border-radius:18px;padding:12px}
.aw-wheel svg{width:100%;height:auto;display:block;touch-action:none}
.aw-month{fill:#edf2ee;stroke:#fff;stroke-width:2;cursor:pointer}.aw-month:hover{fill:#d7e4dc}.aw-month.is-now{fill:#e2ece6}.aw-month.is-on{fill:#183a35}
.aw-mlabel{font:600 13px "Segoe UI",sans-serif;fill:#315f54;pointer-events:none}.aw-mlabel.is-on{fill:#fff}
.aw-ring{opacity:1;fill-opacity:.09}
.aw-arc{cursor:pointer;stroke:#fff;stroke-width:1}.aw-arc.is-sel{stroke:#183a35;stroke-width:2.2}
.aw-arc:focus-visible{outline:none;stroke:#183a35;stroke-width:2.5}
.aw-wedge{fill:#183a35;fill-opacity:.06;pointer-events:none}
.aw-updot{fill:#fff;stroke:#183a35;stroke-width:2;pointer-events:none}
.aw-todayline line{stroke:#c0453a;stroke-width:2.2;stroke-dasharray:4 3}.aw-todayline .pin{fill:#c0453a;stroke:#fff;stroke-width:2}.aw-todayline .pulse{fill:none;stroke:#c0453a;stroke-width:2;pointer-events:none}
.aw-hub circle{fill:#fff;stroke:#dfe6e1}.aw-hub text{text-anchor:middle;pointer-events:none}.aw-hub .y{font:34px Georgia,serif;fill:#183a35}.aw-hub .s{font:700 10px "Segoe UI",sans-serif;letter-spacing:.18em;fill:#65736d}
.aw-banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;align-items:center;gap:10px;background:#183a35;color:#fff;border-radius:99px;padding:6px 8px 6px 14px;font-size:13px;white-space:nowrap}.aw-banner button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:4px 10px;cursor:pointer;font:inherit}
.aw-tip{position:absolute;z-index:5;pointer-events:none;background:#183a35;color:#fff;border-radius:10px;padding:9px 12px;display:grid;gap:2px;max-width:230px;font-size:12.5px;box-shadow:0 8px 22px rgba(24,58,53,.25)}.aw-tip span{font-weight:700;filter:brightness(1.8)}.aw-tip small{opacity:.85}
.aw-legend{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;padding:4px 0 10px}.aw-legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid #e3e9e5;background:#fafbf9;border-radius:99px;padding:5px 10px;font:12px "Segoe UI",sans-serif;color:#22332f;cursor:pointer}.aw-legend button.is-off{opacity:.35}.aw-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.aw-strip{border-top:1px solid #eef2ef;padding-top:10px}.aw-strip-title{font-size:12.5px;color:#41544e;margin:0 4px 6px}.aw-strip-title b{color:#183a35}
.aw-strip svg{width:100%;height:auto}.aw-strip .n{font:600 12px "Segoe UI",sans-serif;fill:#183a35}.aw-strip .m{font:12px "Segoe UI",sans-serif;fill:#65736d}.aw-strip .bar.is-on rect{stroke:#c0453a;stroke-width:2.5}.aw-strip .bar.is-now .m{fill:#c0453a;font-weight:700}
.aw-side{display:grid;gap:12px;position:sticky;top:12px}
.aw-detail{background:#fff;border:1px solid #e3e9e5;border-radius:16px;padding:16px;display:grid;gap:6px}.aw-detail .tag{justify-self:start;background:#53716a;color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:99px}.aw-detail strong{font:22px/1.2 Georgia,serif;color:#183a35}.aw-detail small{color:#65736d}.aw-detail p{margin:4px 0 0;font-size:13.5px;line-height:1.5;color:#33463f}.aw-detail .own{font-weight:600}.aw-detail .note{background:#f5f1e8;border-radius:8px;padding:8px 10px}.aw-detail a{justify-self:start;margin-top:6px;background:#183a35;color:#fff;text-decoration:none;border-radius:8px;padding:7px 12px;font-size:13px}
.aw-detail.is-empty .tag{background:#c0803a}
.aw-list-head{display:flex;justify-content:space-between;align-items:baseline}.aw-list-head h2{font:20px Georgia,serif;color:#183a35;margin:0}.aw-count{font-size:12px;color:#65736d}
.aw-list{display:grid;gap:6px;max-height:520px;overflow:auto;padding-right:4px}
.aw-item{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid #e3e9e5;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit}.aw-item i{width:10px;height:10px;border-radius:50%;flex:none}.aw-item span{display:grid}.aw-item b{font-size:13.5px;color:#183a35;font-weight:600}.aw-item small{font-size:12px;color:#65736d}.aw-item.is-sel{border-color:#183a35;background:#f1f6f3}
@media (max-width:900px){.aw-body{grid-template-columns:1fr}.aw-kpis{grid-template-columns:1fr}.aw-next-track{grid-template-columns:repeat(2,1fr)}.aw-side{position:static}}
.sa-bar{max-width:1240px;margin:0 auto 10px;padding:10px 16px;border-radius:12px;background:#183a35;color:#fff;font:13px "Segoe UI",sans-serif;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sa-bar span{opacity:.85}body{margin:0;padding:18px;background:#eef1ee}</style>

// ---------- layout: departments -> lanes (processes that don't overlap share a lane) ----------
function layout(vis){var rings=[],arcs=[],r=RING0;depts.forEach(function(dep){var items=vis.filter(function(d){return d.dept===dep;}).sort(function(a,b){return a.s-b.s||b.len-a.len;});if(!items.length)return;var lanes=[];items.forEach(function(d){var placed=false;for(var i=0;i<lanes.length&&!placed;i++){if(lanes[i].every(function(o){return !overlap(o,d);})){lanes[i].push(d);d.lane=i;placed=true;}}if(!placed){lanes.push([d]);d.lane=lanes.length-1;}});var inner=r;lanes.forEach(function(l,i){l.forEach(function(d){arcs.push(Object.assign({},d,{innerRadius:inner+i*(LANE+LGAP),outerRadius:inner+i*(LANE+LGAP)+LANE,startAngle:d.s*STEP+.012,endAngle:(d.s+d.len)*STEP-.012}));});});var outer=inner+lanes.length*(LANE+LGAP)-LGAP;rings.push({dept:dep,inner:inner-3,outer:outer+3});r=outer+DGAP;});return{rings:rings,arcs:arcs,outer:r};}

 be.append("rect").attr("x",function(c){return sx(c.m);}).attr("width",sx.bandwidth()).attr("y",SH).attr("height",0).attr("rx",4);be.append("text").attr("class","n").attr("text-anchor","middle");be.append("text").attr("class","m").attr("text-anchor","middle").attr("y",SH+16);
 var ba=be.merge(b);ba.classed("is-on",function(c){return c.m===state.month;}).classed("is-now",function(c){return c.m===curM;});
