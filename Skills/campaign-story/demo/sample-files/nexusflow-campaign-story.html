size:clamp(17px,2vw,23px);line-height:1.42;color:var(--muted);margin:25px 0 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:720px;margin-top:34px}.card{background:white;border:1px solid var(--line);padding:19px;transform:translateY(25px);opacity:0;box-shadow:0 8px 16px #243b5d0b}.active .card{animation:in .55s var(--ease) forwards}.active .card:nth-child(2){animation-delay:.1s}.active .card:nth-child(3){animation-delay:.2s}.num{font-size:12px;color:var(--blue);font-weight:bold}.card b{display:block;font-size:17px;margin:13px 0 6px}.card span{font-size:14px;line-height:1.35;color:var(--muted)}.check{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;margin-top:14px;background:#dff7ed;color:var(--success);font-weight:800;transform:scale(0)}.active .check{animation:tick .45s .45s var(--ease) forwards}.metric h1{font-size:clamp(130px,26vw,290px);color:var(--blue);line-height:.75}.metric h1 i{font-size:.42em;color:var(--electric)}.metric:after{content:'✓';position:absolute;right:13%;top:32%;display:grid;place-items:center;width:90px;height:90px;border-radius:50%;background:#dff7ed;color:var(--success);font-size:42px;font-weight:800;animation:tick .6s .4s var(--ease) both}.payoff{background:var(--ink);color:white}.payoff p{color:#bcc8dd}.payoff h1 i{color:#67c8ff}.caption{position:absolute;z-index:6;left:10%;right:10%;bottom:54px;font-size:15px;color:var(--muted);min-height:40px}.caption span{opacity:.28;transition:opacity .15s}.caption span.on{opacity:1;color:var(--ink)}.payoff~.caption{color:#8fa4c3}.notice{position:absolute;z-index:10;right:28px;top:55px;max-width:275px;padding:12px;background:var(--ink);color:#fff;font-size:13px;opacity:0;transform:translateY(-8px);transition:.2s}.notice.show{opacity:1;transform:none}.progress{position:absolute;z-index:8;left:0;right:0;bottom:0;height:6px;display:flex;gap:2px}.progress button{flex:1;padding:0;border:0;background:#dbe4f0;cursor:pointer}.progress i{display:block;width:0;height:100%;background:var(--blue)}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}.controls button,.controls select{background:white;border:1px solid var(--line);padding:10px 13px;color:var(--ink);font-size:13px;cursor:pointer;transition:transform .16s var(--ease),box-shadow .16s}.controls button:hover{transform:translateY(-2px);box-shadow:0 5px 10px #26456b22}.controls .primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:bold;animation:pulse 2.2s infinite}.status{margin-left:auto;color:var(--muted);font-size:12px}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;width:10px;height:16px;top:-20px;animation:fall 2.4s linear forwards}.scene.active .piece:nth-child(3n){background:var(--blue)}.scene.active .piece:nth-child(3n+1){background:#ffb000}.scene.active .piece:nth-child(3n+2){background:#00b990}@keyframes in{to{opacity:1;transform:none}}@keyframes tick{0%{transform:scale(0) rotate(-30deg)}75%{transform:scale(1.17) rotate(8deg)}100%{transform:scale(1)}}@keyframes pulse{50%{box-shadow:0 0 0 8px #1c61e720}}@keyframes fall{to{transform:translateY(780px) rotate(540deg);opacity:0}}@media(max-width:650px){body{padding:8px}.stage{min-height:520px}.scene{padding:22% 9%}.grid{grid-template-columns:1fr}.caption{bottom:36px}.status{display:none}.chrome{left:24px;right:24px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}</style>

</head><body><main class="app"><header class="mast"><div class="brand">nexus<span>flow</span></div><small>Fictional B2B customer story</small></header><section class="stage" id="stage"><div class="rail"></div><div class="chrome"><span>Customer operations story</span><span id="folio">01 / 06</span></div><div id="host"></div><div class="caption" id="caption"></div><div class="notice" id="notice">Narration is ready — select Play to hear it.</div><div class="progress" id="progress"></div></section><nav class="controls"><button class="primary" id="play">❚❚ Pause</button><button id="prev">←</button><button id="next">→</button><button id="restart">↻ Restart</button><button id="voice" aria-pressed="true">Narration on</button><select id="voicePicker" aria-label="Narration voice"><option>Default voice</option></select><select id="rate"><option value=".9">0.9×</option><option value="1" selected>1.0×</option><option value="1.15">1.15×</option></select></nav></main><script>var S=[["Pain point","Dispatch was <i>always reacting.</i>","Fictional freight broker Velora Freight had order updates in five places. Customers heard about exceptions too late.","Velora Freight is fictional. Its dispatch team was always reacting because order updates lived in five different places."],["Moment one","One live <i>control view.</i>","NexusFlow brought carrier, warehouse, customer, and route signals into a single action queue.","First, NexusFlow brought carrier, warehouse, customer, and route signals into one live control view."],["Moment two","Risks surfaced <i>before</i> the call.","Smart alerts highlighted deliveries at risk, so dispatch could intervene while there was still time.","Second, smart alerts surfaced deliveries at risk before customers had to call."],["Moment three","Every team knew the <i>next move.</i>","A shared action card gave each exception an owner, deadline, and clear customer update.","Third, every exception had a clear owner, a deadline, and a customer update ready to send."],["Measured outcome","41<i>%</i>","fewer delayed deliveries in the fictional first quarter.","The fictional first quarter result was forty-one percent fewer delayed deliveries."],["The payoff","Make every delivery feel <i>on time.</i>","NexusFlow turns logistics noise into confident customer moments.","NexusFlow turns logistics noise into confident customer moments. Make every delivery feel on time."]],cur=0,playing=true,voice=true,utt,timer,raf;var host=document.getElementById('host'),caption=document.getElementById('caption'),progress=document.getElementById('progress'),notice=document.getElementById('notice'),stage=document.getElementById('stage');function fillVoices(){var p=document.getElementById('voicePicker');if(!('speechSynthesis' in window)||!p)return;var keep=p.value,vs=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)});p.innerHTML='<option value="">Default voice</option>';vs.forEach(function(v){var o=document.createElement('option');o.value=v.name;o.textContent=v.name+' · '+v.lang;p.append(o)});if(keep)p.value=keep}if('speechSynthesis' in window){fillVoices();speechSynthesis.addEventListener('voiceschanged',fillVoices)}function cards(){return '<div class="grid"><div class="card"><span class="num">01</span><b>See</b><span>Spot risk signals in one place.</span><i class="check">✓</i></div><div class="card"><span class="num">02</span><b>Assign</b><span>Give each exception an owner.</span><i class="check">✓</i></div><div class="card"><span class="num">03</span><b>Act</b><span>Update customers with confidence.</span><i class="check">✓</i></div></div>'}function confetti(){return '<div class="confetti">'+Array.from({length:50},function(_,i){return '<i class="piece" style="left:'+(i*13%100)+'%;animation-delay:'+((i%11)*.08)+'s"></i>'}).join('')+'</div>'}function draw(){var s=S[cur],e=document.createElement('article');e.className='scene '+(cur===4?'metric ': '')+(cur===5?'payoff':'');e.innerHTML='<div class="tag">'+s[0]+'</div><h1>'+s[1]+'</h1><p>'+s[2]+'</p>'+((cur>0&&cur<4)?cards():'')+(cur===5?confetti():'');host.innerHTML='';host.append(e);requestAnimationFrame(function(){e.classList.add('active')});folio.textContent=String(cur+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');caption.innerHTML=s[3].split(' ').map(function(w){return '<span>'+w+' </span>'}).join('');[...progress.children].forEach(function(x,k){x.firstChild.style.width=k<cur?'100%':'0'});run()}function animate(d){cancelAnimationFrame(raf);var b=progress.children[cur].firstChild,st=performance.now();b.style.width='0';(function f(t){var p=Math.min(1,(t-st)/d);b.style.width=(p*100)+'%';if(p<1&&playing)raf=requestAnimationFrame(f)})(st)}function run(){clearTimeout(timer);if(!playing)return;var text=S[cur][3],w=[...caption.children],i=0,d=Math.max(4300,w.length*330)/(+rate.value);animate(d);var h=setInterval(function(){if(!playing)return clearInterval(h);w.forEach(function(x,k){x.className=k<=i?'on':''});i++;if(i>=w.length)clearInterval(h)},d/w.length);if(voice&&'speechSynthesis' in window){speechSynthesis.cancel();utt=new SpeechSynthesisUtterance(text);utt.rate=+rate.value;var chosen=speechSynthesis.getVoices().filter(function(v){return v.name===document.getElementById('voicePicker').value})[0];if(chosen){utt.voice=chosen;utt.lang=chosen.lang}utt.onstart=function(){notice.classList.remove('show')};utt.onend=function(){if(playing)setTimeout(nextScene,420)};utt.onerror=function(){notice.classList.add('show')};speechSynthesis.speak(utt);setTimeout(function(){if(playing&&!speechSynthesis.speaking){notice.classList.add('show')}},650)}else timer=setTimeout(nextScene,d)}function go(n){if('speechSynthesis' in window)speechSynthesis.cancel();cur=Math.max(0,Math.min(S.length-1,n));draw()}function nextScene(){if(cur<S.length-1)go(cur+1);else{playing=false;play.textContent='▶ Replay'}}function activate(){notice.classList.remove('show');if(playing&&voice&&!speechSynthesis.speaking)run()}play.onclick=function(){if(!playing&&cur===S.length-1){playing=true;play.textContent='❚❚ Pause';go(0)}else{playing=!playing;if(!playing){speechSynthesis.cancel();clearTimeout(timer);play.textContent='▶ Play'}else{play.textContent='❚❚ Pause';activate()}}};prev.onclick=function(){go(cur-1)};next.onclick=function(){go(cur+1)};restart.onclick=function(){playing=true;go(0)};document.getElementById('voicePicker').onchange=function(){if(voice&&playing){speechSynthesis.cancel();run()}};voice.onclick=function(){voice=!voice;this.textContent=voice?'Narration on':'Narration off';this.setAttribute('aria-pressed',voice);if(voice)activate();else speechSynthesis.cancel()};document.addEventListener('pointerdown',activate);document.onkeydown=function(e){if(e.key===' ')play.click();else if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key.toLowerCase()==='n')voice.click();activate()};S.forEach(function(_,i){var b=document.createElement('button');b.innerHTML='<i></i>';b.onclick=function(){go(i)};progress.append(b)});draw()</script></body></html>
