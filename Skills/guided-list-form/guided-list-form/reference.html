<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided Form</title>
<style>
:root{--fg:#183A35;--cr:#F2643D;--cm:#F7F5F1;--w:rgba(255,255,255,.8);--s:rgba(247,245,241,.45);--g:rgba(247,245,241,.06);--d:rgba(247,245,241,.28)}
*{box-sizing:border-box}
html,body,#gf-root,.shell{margin:0;height:100%;min-height:100vh}

@keyframes gfS{50%{background-position:100% 50%}}
@keyframes gfI{from{opacity:0;transform:translateY(24px)}}
@keyframes gfO{to{opacity:0;transform:translateY(-24px)}}
@keyframes gfB{40%{transform:scale(1.04)}}
@keyframes gfK{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shell{display:flex;flex-direction:column;position:relative}
.bar{position:fixed;top:0;left:0;right:0;height:6px;background:rgba(255,255,255,.25);z-index:5}
.bar.hide{opacity:0;pointer-events:none}
.fill{height:100%;width:0;background:var(--cr);transition:width .4s}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 24px 48px}
.col{width:100%;max-width:640px}
.in{animation:gfI .35s ease-out}
.out{animation:gfO .25s ease-in forwards}
.kicker{margin:0;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--w)}
.meta,.help,.hint,.counter{color:var(--w)}
.meta{margin:16px 0 0}
.title{margin:12px 0 0;font-size:32px;font-weight:600;line-height:1.2}
.help{margin:10px 0 0}
.counter{margin:0 0 8px;font-size:14px;font-weight:600}
.field{margin-top:28px}
.inp,.area{width:100%;appearance:none;border:0;border-bottom:2px solid var(--s);background:0;color:#fff;font:400 24px/1.4 inherit;padding:8px 0;outline:0;resize:none}
.area{min-height:2.8em;overflow:hidden}
.inp::placeholder,.area::placeholder{color:rgba(255,255,255,.4)}
.inp:focus,.area:focus{border-bottom-color:var(--cm);box-shadow:0 2px 0 var(--cm)}
.opt:focus-visible,.rate:focus-visible,.pill:focus-visible,.back:focus-visible,.link:focus-visible{outline:2px solid #fff;outline-offset:3px}
.opts{display:flex;flex-direction:column;gap:10px;margin:24px 0 0}
.opt,.rate{border:1px solid var(--d);background:var(--g);color:#fff;cursor:pointer;font:600 18px inherit}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border-radius:14px;text-align:left}
.opt.on,.rate.on{background:var(--cm);color:var(--fg);animation:gfB .15s ease}
.ltr{flex:0 0 28px;width:28px;height:28px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--s);font-size:13px;font-weight:700}
.opt.on .ltr{border-color:var(--cr);color:var(--cr);box-shadow:0 0 0 2px var(--cr)}
.chk{margin-left:auto;opacity:0}.opt.on .chk{opacity:1}
.rates{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.rate{width:48px;height:48px;border-radius:8px}
.rate.on{border-color:var(--cr);box-shadow:0 0 0 2px var(--cr)}
.acts{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:36px}
.end{display:flex;align-items:center;gap:12px;margin-left:auto}
.pill{border:0;border-radius:999px;background:var(--cm);color:var(--fg);font:700 16px inherit;padding:12px 22px;cursor:pointer}
.back,.link{border:0;background:0;color:#fff;font:600 16px inherit;text-decoration:underline;padding:8px;cursor:pointer}
.hint{font-size:14px}
.msg{display:flex;gap:10px;margin-top:14px;color:var(--cm);font-size:15px}
.msg[hidden]{display:none}
.dot{flex:0 0 8px;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--cr)}
.shake{animation:gfK .2s ease}
.rlist{max-height:280px;overflow-y:scroll;margin:24px 0 0;padding:0 16px 8px 0;scrollbar-width:thin;scrollbar-color:rgba(247,245,241,.5) rgba(247,245,241,.1)}

.rlist::-webkit-scrollbar-thumb{background:rgba(247,245,241,.5);border-radius:999px}
.rlist::-webkit-scrollbar-button{display:none}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:12px 0;border-bottom:1px solid rgba(247,245,241,.18)}
.rlab{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.rval{margin:4px 0 0;font-size:16px;overflow-wrap:anywhere}
.empty{color:rgba(255,255,255,.55);font-style:italic}
.done{text-align:center}
.done .acts{justify-content:center}
.mark{width:72px;height:72px;margin:0 auto 24px;border-radius:50%;background:var(--cm);color:var(--fg);box-shadow:0 0 0 4px var(--cr);display:grid;place-items:center;font-size:36px;font-weight:700}
.live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(prefers-reduced-motion:reduce){body,.in,.out,.opt.on,.rate.on,.shake{animation:none}.fill{transition:none}}
</style>
</head>
