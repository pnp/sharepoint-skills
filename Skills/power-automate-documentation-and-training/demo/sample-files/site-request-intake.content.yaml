# Handoff file written at the end of the chat playback for the fictional sample flow.
goal: Every approved site request gets a ready site and an email to its owner, and urgent ones reach the triage channel.
audience: New makers on an IT team who will maintain this flow.
meta:
  title: "Build the flow: weekly site request intake"
  summaryLead: >-
    Fifteen steps: read the open requests every Monday, wait for each approved site to be ready,
    email the owner, and send urgent requests to triage. A failure path catches broken runs.
parts:
  - {title: Collect the requests, steps: [Every_Monday, Initialize_state, Get_requests, Log_count]}
  - {title: Handle each request, steps: [Apply_to_each_request, Is_approved, Wait_until_ready, Delay, Check_provisioning, Set_state, Email_the_owner, By_priority, Post_to_triage, By_priority__empty_default]}
  - {title: When something fails, steps: [Notify_on_failure, Failure_note]}
steps:
  Every_Monday:
    what: Start the flow every Monday at 07:00.
    why: This is the start of the job, getting every open request handled once a week. A schedule means nobody has to press Run. Next the flow sets up a status variable.
  Initialize_state:
    what: Create the `state` variable, starting at `Pending`.
    why: The loop further down needs a value to watch, and a variable must exist before a loop can change it. Next the flow reads the open requests.
  Get_requests:
    what: Read every request that is not done yet.
    why: We have a schedule and a variable but no requests yet. The filter keeps finished ones out, so each run only sees open work. Next the flow counts them and goes through them one by one.
  Log_count:
    what: Note how many open requests this run found.
    why: A count in the run history makes it easy to see whether a run picked anything up. In the designer this runs side by side with the loop.
  Apply_to_each_request:
    what: Run the steps inside the box once for every open request.
    counter: {label: requests, count: 12}
    why: Get items returns a list, but each request needs its own decision. The first thing inside is the approval check.
  Is_approved:
    what: Check that the request is approved and has an owner.
    arms: {yes: "YES \u00b7 approved", no: "NO \u00b7 not yet"}
    why: Only approved requests with an owner should get a site. YES waits for the site, NO looks at the priority.
    quiz:
      ask: A request is approved but has no owner email. Which arm runs?
      options:
        - {text: The NO arm, correct: true, feedback: Both parts of the AND must be true.}
        - {text: The YES arm, correct: false, feedback: The AND needs an owner email too.}
  Wait_until_ready:
    what: Repeat the steps inside until the site reports Ready.
    laps: ["state: Pending", "state: Pending", "state: Ready \u2713"]
    why: Provisioning takes a while. The loop checks again until the state changes, with a cap of 10 laps or one hour.
  Delay:
    what: Pause 30 seconds at the start of each lap.
    why: Checking again right away would flood the service. Next the flow asks for the status.
  Check_provisioning:
    what: Ask the provisioning service for the site status.
    packet: status
    why: After the pause we still do not know whether the site is ready, so we ask. Next we store the answer.
  Set_state:
    what: Copy the reported state into the variable.
    why: The loop only watches the variable, so the answer has to land there. Ready ends the loop.
  Email_the_owner:
    what: Tell the owner the site is ready.
    why: The loop ended, so the site is ready. This is where the goal happens for approved requests.
  By_priority:
    what: Pick a path by the request priority.
    why: Requests that are not approved yet can still be urgent. High goes to triage, everything else waits.
  Post_to_triage:
    what: Post the request in the triage channel.
    why: Urgent requests need a human quickly, even before approval.
  Notify_on_failure:
    what: Run the steps inside only if the loop failed or timed out.
    why: The run after settings make this an error path, so a broken run leaves a note instead of failing silently.
  Failure_note:
    what: Write a short note with the run name.
    why: The note tells whoever looks at the run history which run broke.
guardrails:
  - {title: Approved and owned, text: The condition needs both an approval and an owner email., step: Is_approved}
  - {title: Capped wait, text: The Do until loop stops after 10 laps or one hour., step: Wait_until_ready}
  - {title: Failure path, text: The scope runs only when the loop fails or times out., step: Notify_on_failure}
checks:
  title: What you covered
  items:
    - {text: The weekly trigger, done: true}
    - {text: One decision per request, done: true}
    - {text: A capped wait loop, done: true}
    - {text: The failure path, done: true}
