<!-- Sample of the styles SharePoint's page authoring adds to a saved HTML page: the site theme variables
     and a generic document stylesheet. Tenant font files are removed. Used by robustness_check.py. -->
<style data-sp-site-theme>:root{--colorBrandBackground:#161616;--colorBrandBackgroundHover:#03274a;--colorBrandBackground2:#e3e3e3;--colorBrandForeground1:#161616;--colorNeutralForeground1:#323130;--colorNeutralForeground2:#605e5c;--colorNeutralForegroundOnBrand:#ffffff;--colorNeutralBackground1:#ffffff;--colorNeutralBackground2:#faf9f8;--colorNeutralStroke1:#d0d0d0;--fontFamily:"Site Theme Font", 'Segoe UI', 'Segoe UI Web (West European)', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;}</style>
<style>*{box-sizing:border-box;margin:0;padding:0}html{-webkit-text-size-adjust:100%}:root{--doc-bg:var(--colorNeutralBackground2,#f0f0f0);--doc-canvas:var(--colorNeutralBackground1,#fff);--doc-surface:var(--colorNeutralBackground1,#fff);--doc-border:var(--colorNeutralStroke1,#edebe9);--doc-font:var(--fontFamily,"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif);--doc-title-font:var(--doc-font);--doc-title-color:var(--colorNeutralForeground1,#1b1a19);--doc-text:var(--colorNeutralForeground1,#242424);--doc-muted:var(--colorNeutralForeground2,#605e5c)}body{font-family:var(--doc-font);-webkit-font-smoothing:antialiased;color:var(--doc-text);background:var(--doc-bg);line-height:1.5}h1,h2,h3,h4,h5,h6{font-family:var(--doc-title-font);color:var(--doc-title-color);line-height:1.2}p{color:var(--doc-text)}a{color:#0f6cbd;text-decoration:none}a:hover{text-decoration:underline}strong{color:var(--doc-title-color)}table{border-collapse:collapse}th{color:var(--doc-muted);border-bottom:1px solid var(--doc-border);text-align:left}td{color:var(--doc-text);border-bottom:1px solid var(--doc-border)}hr{border:none;border-top:1px solid var(--doc-border)}img{max-width:100%;height:auto}.rpt-img-omitted{display:inline-block;padding:2px 8px;border:1px dashed var(--doc-border);border-radius:6px;color:var(--doc-muted);font-size:12px}code{font-family:"Cascadia Code",Consolas,monospace;background:var(--doc-surface)}</style>
