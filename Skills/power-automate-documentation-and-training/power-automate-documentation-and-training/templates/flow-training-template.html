button{padding:6px 9px;font-size:.76rem}

}

.endnav{margin-top:10px}
}

<header class="top"><div class="eyebrow" id="ft-eyebrow">Training module &#183; Power Automate</div><h1 id="ft-title">Sample flow: new request to a SharePoint list</h1><p class="lede" id="ft-lede">Click + to add each step. It draws itself, and a card explains what it does and how to set it up.</p></header>

var INK='#03274A',MED='#164C80',PAPER='#fffef8',YEL='#FFD633',OK='#417B5A',GREY='#8c8c89';

var DATA={"meta":{"title":"Sample flow: new request to a SharePoint list","eyebrow":"Training module \u00b7 Power Automate","lede":"Click + to add each step. It draws itself, and a card explains what it does and how to set it up.","summaryHeading":"You built the flow","summaryLead":"Three steps: a request comes in, the flow checks it, and only approved requests become list items."},
"steps":[
{"id":"Trigger","kind":"node","trigger":true,"title":"When a request is submitted","sub":"Forms \u00b7 new response","k":"Trigger","what":"Every flow starts with a trigger.","why":"This is where the job starts: each new request should end up in the list once it is approved. Next the flow decides whether it is approved.","cfg":[["Form","Requests"]],"crumb":["Start","Condition"]},
{"id":"Condition","kind":"cond","title":"Approved?","sub":"status is equal to Approved","k":"Control \u00b7 Condition","what":"Split the flow by the request status.","why":"The trigger handed over one request. Only approved ones should reach the list, so this decides which arm runs.","cfg":[["Expression","`status` is equal to `Approved`"]],"crumb":["Trigger","YES or NO arm"],"quiz":{"ask":"What happens to a request that is not approved?","opts":[{"t":"It runs the NO arm, which does nothing","ok":true,"fb":"The NO arm is empty on purpose."},{"t":"It is created anyway","ok":false,"fb":"Only the YES arm creates the item."}]}},
{"id":"Create_item","kind":"node","parent":"Condition","branch":"yes","armName":"YES","armLabel":"YES \u00b7 approved","title":"Create item","sub":"SharePoint \u00b7 Create item","k":"SharePoint \u00b7 Create item","icon":"S","iconBg":"#036c70","what":"Create the list item for this request.","why":"The condition said YES, so this request is approved. This is where the goal happens.","cfg":[["List","Requests"]],"crumb":["Condition: YES","Finish"]},

/* ---------- check DATA: stop with a named error, never fall back to the sample ---------- */
function blank(v){return v==null||String(v).replace(/\s+/g,'')==='';}
function checkData(D){
  var E=[],ids={},st=D&&D.steps;

        o.forEach(function(x,k){if(!x||blank(x.t)||blank(x.fb))E.push(n+'quiz option '+(k+1)+' needs both t and fb.');});}}
  });
  st.forEach(function(s,i){
    if(!s||typeof s!=='object'||s.parent==null)return;

    else D.guards.forEach(function(g,k){if(!Array.isArray(g)||blank(g[0])||blank(g[1]))E.push('Guardrail '+(k+1)+': needs a title and a text.');});}
  if(D.checks!=null){var it=D.checks.items;if(it!=null&&!Array.isArray(it))E.push('checks.items must be a list.');
    else (it||[]).forEach(function(c,k){if(blank(typeof c==='string'?c:(c&&c.t)))E.push('Checklist item '+(k+1)+': t is empty.');});}
  if(D.parts!=null){if(!Array.isArray(D.parts))E.push('parts must be a list.');
    else D.parts.forEach(function(p,k){if(!p||blank(p.title))E.push('Part '+(k+1)+': title is empty.');((p&&p.steps)||[]).forEach(function(id){if(!ids[id])E.push('Part '+(k+1)+': '+id+' is not a step id.');});});}
  return E;
}

    ink(e,seg(R,notch[0][0],notch[0][1],notch[1][0],notch[1][1],0.3,1)+seg(R,notch[1][0],notch[1][1],notch[2][0],notch[2][1],0.3,1),INK,1.5);}
}
var geom=null;
function place(){
  if(card.hidden||!$('end').hidden){drawLead(null);geom=null;return;}
  var now=performance.now(),u=1;
  if(glide){u=Math.min(1,(now-glide.t0)/glide.dur);if(u>=1)glide=null;}
  var wh=stageWH(),vw=wh[0],vh=wh[1];
  if(cardIdx<0){ if(!isPhone()){card.style.left=(vw-card.offsetWidth-16)+'px';card.style.top='16px';}else{card.style.left='';card.style.top='';}
    drawLead(null);geom=null;return;}
  if(isPhone()){
    card.style.left='';card.style.top='';
    var A=scr(cardIdx),ct=card.offsetTop,cl=card.offsetLeft,cw=card.offsetWidth;
    var axp=S[cardIdx].kind==='loop'?(A.x1+A.x2)/2:Math.min(A.x2-20,A.x1+(A.x2-A.x1)*0.3);
    var x0=Math.max(16,Math.min(vw-16,axp)),y0=A.y2+3,x1=Math.max(cl+26,Math.min(cl+cw-26,x0)),y1=ct-1;
    geom={card:{x1:cl,y1:ct,x2:cl+cw,y2:ct+card.offsetHeight},box:A,mode:'sheet'};
    if(y1-y0<14){drawLead(null);return;}
    drawLead([x0,y0],[x1,y1],true,glide?Math.max(0.05,u):1,[[x1-9,y1+1],[x1,y1-10],[x1+9,y1+1]]);return;}
  var T=target(cardIdx),l=T.l,t=T.t;
  if(glide){var e=ease(u);l=glide.fl+(T.l-glide.fl)*e;t=glide.ft+(T.t-glide.ft)*e;}
  card.style.left=Math.round(l)+'px';card.style.top=Math.round(t)+'px';
  var A2=T.A,p0,p1,vert=false,nt;
  if(T.mode==='side'){var right=T.side==='right';var ay=Math.max(A2.y1+10,Math.min(A2.y2-10,A2.ay));
    p0=[right?A2.ex2+2:A2.ex1-2,ay];var ex=right?l:l+T.cw,ey=Math.max(t+24,Math.min(t+T.ch-24,ay));p1=[right?ex-10:ex+10,ey];
    nt=right?[[ex+1,ey-9],[ex-10,ey],[ex+1,ey+9]]:[[ex-1,ey-9],[ex+10,ey],[ex-1,ey+9]];}
  else{vert=true;var below=T.mode==='below',cxm=(A2.x1+A2.x2)/2;p0=[cxm,below?A2.y2+2:A2.y1-2];var bx=Math.max(l+26,Math.min(l+T.cw-26,cxm)),by=below?t:t+T.ch;
    p1=[bx,below?by-10:by+10];nt=below?[[bx-9,by+1],[bx,by-10],[bx+9,by+1]]:[[bx-9,by-1],[bx,by+10],[bx+9,by-1]];}
  geom={card:{x1:l,y1:t,x2:l+T.cw,y2:t+T.ch},box:{x1:A2.x1,y1:A2.y1,x2:A2.x2,y2:A2.y2},mode:T.mode,side:T.side};
  drawLead(p0,p1,vert,glide?Math.max(0.05,u):1,nt);
}
function fitsNow(){var g=geom;if(!g)return true;var wh=stageWH(),c=g.card,b=g.box;
  if(c.x1<0||c.y1<0||c.x2>wh[0]+1||c.y2>wh[1]+1)return false;
  if(b.x1<0||b.y1<0||b.x2>wh[0]||b.y2>wh[1])return false;
  return !(c.x1<b.x2&&c.x2>b.x1&&c.y1<b.y2&&c.y2>b.y1);}
window.__ftPlace=function(){place();};
d3.timer(function(){if(glide||!card.hidden)place();});
/* ---------- card ---------- */
var card=$('card'),cin=$('cin'),cink=d3.select('#cink');
function inkCard(){
  var w=card.offsetWidth,h=card.offsetHeight;if(!w)return;
  cink.attr('width',w).attr('height',h);cink.selectAll('*').remove();
  var p=ink(cink,rrect(rng(cardIdx*13+5),1.5,1.5,w-3,h-3,0.8),INK,1.6);
  if(!RM){var L=p.node().getTotalLength();p.attr('stroke-dasharray',L+' '+L).attr('stroke-dashoffset',L).transition().duration(650).ease(d3.easeSinInOut).attr('stroke-dashoffset',0).on('end',function(){d3.select(this).attr('stroke-dasharray',null);});}
}
function pop(){card.hidden=false;card.classList.remove('pop');card.classList.remove('shake');void card.offsetWidth;if(!RM)card.classList.add('pop');inkCard();}
function stepNo(i){var p=order.indexOf(i);return (p<0?i:p)+1;}
function navHtml(i){
  var l=last();
  if(i!==l)return '<div class="cnav"><button type="button" data-act="cur">'+A+' Current step</button><button type="button" data-act="fit">Show whole canvas</button></div>';
  var acts=actions(),r='';
  if(acts[0].finish)r='<button type="button" class="primary" data-act="finish">Finish '+A+'</button>';
  else if(acts.length>1)r=acts.slice(0,3).map(function(a){var s=S[a.i];return '<button type="button" class="primary'+(locked()?' locked':'')+'" data-act="add" data-i="'+a.i+'">'+(isArmStart(a.i)?'Build '+esc(s.armName||'next')+' +':'Add '+esc(s.title)+' +')+'</button>';}).join('');
  else r='<button type="button" class="primary'+(locked()?' locked':'')+'" data-act="add" data-i="'+acts[0].i+'">'+(isArmStart(acts[0].i)?'Build '+esc(S[acts[0].i].armName||'next')+' arm +':'Add next step +')+'</button>';
  return '<div class="cnav"><button type="button" data-act="back"'+(order.length<=1?' disabled':'')+'>'+'\u2190 Back</button><div class="r">'+r+'</div></div>';
}
function openCard(i,review){
  var prev=cardIdx,moving=!card.hidden&&prev!==i;
  if(moving&&!RM)ghostOut();
  cardIdx=i;var s=S[i],q=s.quiz,ans=answered[i],h='';
  h+='<div class="chead"><div class="t"><div class="kick">'+esc(s.k||'')+'</div><h2>'+esc(s.title)+'</h2></div><div class="cnt">Step '+stepNo(i)+' of '+N+'</div><button type="button" class="minbtn" data-act="min" aria-label="Collapse or expand the card">\u2013</button></div><div class="cbody">';
  if(s.guard)h+='<div class="guard">Guardrail '+esc(s.guard[0])+' '+DOT+' '+esc(s.guard[1])+'</div>';
  h+='<p class="what">'+fmt(s.what)+'</p>';
  var hide=q&&!ans;
  if(hide){h+='<div class="quiz"><div class="qa">Quick check</div><p>'+fmt(q.ask)+'</p><div class="opts">'+q.opts.map(function(o,k){return '<button type="button" data-o="'+k+'">'+fmt(o.t)+'</button>';}).join('')+'</div><div class="fb" aria-live="polite"></div></div>';}
  h+='<div class="reveal'+(hide?' hide':'')+'"><div class="sec">Why this step</div>';
  if(s.crumb)h+='<div class="crumb">'+esc(s.crumb[0])+' '+A+' <b>this step</b> '+A+' '+esc(s.crumb[1])+'</div>';
  h+='<p>'+fmt(s.why)+'</p><div class="sec">How to configure</div><dl class="cfg">'+s.cfg.map(function(c){return '<dt>'+esc(c[0])+'</dt><dd>'+fmt(c[1])+'</dd>';}).join('')+'</dl>';
  h+=(s.tip?'<p class="tip">'+fmt(s.tip)+'</p>':'')+'</div>';
  if(q&&ans){var ok=q.opts.filter(function(o){return o.ok;})[0];h+='<div class="answered"><b>'+TICK+' Quick check:</b> '+fmt(q.ask)+' <b>'+fmt(ok.t)+'</b></div>';}
  h+='</div>'+navHtml(i);
  cin.innerHTML=h;card.classList.remove('min');
  if(card.hidden||prev<0){glide=null;pop();}
  else{inkCard();if(moving&&!RM)startGlide(prev,i);}
  setHL(i);place();
  if(!review)focusRegion(region(i),600,i);
  else if(!fitsNow())focusRegion(region(i),RM?0:560,i);
}
function openOverview(){
  cardIdx=-2;var h='<div class="chead"><div class="t"><div class="kick">Overview</div><h2>The whole flow</h2></div><button type="button" class="minbtn" data-act="min" aria-label="Collapse or expand the card">\u2013</button></div><div class="cbody"><p>'+word(N)+' step'+(N>1?'s':'')+(PARTS.length>1?' in '+word(PARTS.length,true)+' parts':'')+'. Click any step on the canvas, or a button below, to open its card.</p><ul class="ov">';
  PARTS.forEach(function(p,pi){h+='<li><b>'+(pi+1)+' '+DOT+' '+esc(p.title)+'</b>';S.forEach(function(s,i){if(s.part===pi)h+='<button type="button" data-act="goto" data-i="'+i+'">'+esc(s.title)+'</button>';});h+='</li>';});
  h+='</ul></div><div class="cnav"><button type="button" data-act="replay">\u21BB Build it step by step</button><button type="button" class="primary" data-act="finish">Summary '+A+'</button></div>';
  cin.innerHTML=h;card.classList.remove('min');glide=null;pop();setHL(-1);place();
}
function setHL(i){
  gSteps.selectAll('.hl').selectAll('*').remove();
  var hl=gSteps.select('.step[data-i="'+i+'"] .hl');if(hl.empty())return;
  var d=hl.datum(),p=ink(hl,hachure(rng(99+i),d.x,d.y,d.w,d.h,7),YEL,2.2).attr('opacity',0.75);
  if(!RM){var L=p.node().getTotalLength();p.attr('stroke-dasharray',L+' '+L).attr('stroke-dashoffset',L).transition().duration(700).attr('stroke-dashoffset',0);}
}
function answer(i,k){
  var s=S[i],o=s.quiz.opts[k];answered[i]={o:k};
  var bs=cin.querySelectorAll('.opts button');
  for(var j=0;j<bs.length;j++){bs[j].disabled=true;if(s.quiz.opts[j].ok)bs[j].classList.add('right');else if(j===k)bs[j].classList.add('wrong');}
  cin.querySelector('.fb').innerHTML=(o.ok?'<b class="y">'+TICK+' Right.</b> ':'<b class="n">Not quite.</b> ')+fmt(o.fb);
  var rv=cin.querySelector('.reveal');if(rv)rv.classList.remove('hide');
  cin.querySelector('.cnav').outerHTML=navHtml(i);
  renderPlus(0);update();inkCard();
  if(isPhone())focusRegion(region(i),400,i);
}
cin.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.hasAttribute('data-o')){answer(cardIdx,+b.getAttribute('data-o'));return;}
  var a=b.getAttribute('data-act');
  if(a==='add')doAct({i:+b.getAttribute('data-i')});
  else if(a==='back')back();
  else if(a==='finish')doAct({finish:true});
  else if(a==='cur')openCard(last());
  else if(a==='fit'){fitAll();}
  else if(a==='goto')openCard(+b.getAttribute('data-i'));
  else if(a==='replay')replay();
  else if(a==='min'){toggleMin();}
});
function toggleMin(){if(card.hidden)return;card.classList.toggle('min');inkCard();if(isPhone()&&cardIdx>=0)focusRegion(region(cardIdx),300,cardIdx);}

/* ---------- end screen ---------- */
var end=$('end');
var PAL=['#03274A','#164C80','#417B5A','#FFD633','#036c70','#5b8fbf','#2f6b6b','#7a6200','#5b4a8a'];
function showEnd(){
  if(order.length<N)return;
  var done=CHECKS.filter(function(c){return c.done;}).length,nC=CHECKS.length;
  var h='<div class="endin"><div class="eyebrow" style="color:#164C80">Summary</div><h2>'+esc(META.summaryHeading||'You built the flow')+'</h2><p class="endlead">'+fmt(META.summaryLead||'')+'</p>';
  if(GUARDS.length){h+='<div class="guards" style="--gcols:'+(GUARDS.length===4?2:Math.min(3,GUARDS.length))+'">';
    GUARDS.forEach(function(g,k){h+='<div class="gcard"><svg class="gink" aria-hidden="true"></svg><span class="gnum">'+(k+1)+'</span><b>'+esc(g[0])+'</b><p>'+fmt(g[1])+'</p></div>';});h+='</div>';}
  if(nC){h+='<div class="endgrid"><svg class="gink" aria-hidden="true"></svg><div><h3>'+esc(CK.title||'Checklist')+'</h3><ul class="checks">';
    CHECKS.forEach(function(c,k){h+='<li><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="box" x="2" y="2" width="20" height="20" rx="3"></rect>'+(c.done?'<path d="M6 12.5C7.5 14 8.6 15.3 10 17.2C12.6 12.6 15.4 9.4 19 6" style="animation-delay:'+(0.25+k*0.22).toFixed(2)+'s"></path>':'')+'</svg><span>'+esc(c.t)+'</span><span class="sr"> '+(c.done?'done':'open')+'</span></li>';});
    h+='</ul></div><div id="chartwrap"><div class="chartbox"><canvas id="ft-chart" width="200" height="200" aria-label="'+done+' of '+nC+' '+esc(CK.center||'done')+'" role="img"></canvas><div class="cc"><b>'+done+'/'+nC+'</b><span>'+esc(CK.center||'done')+'</span></div></div><div class="chartcap">'+esc(CK.caption||'One slice per item')+'</div></div></div>';}
  h+='<div class="endnav"><button type="button" class="primary" data-e="replay">\u21BB Build it again</button><button type="button" data-e="back">\u2190 Back to the flow</button><button type="button" data-e="whole">Whole flow</button></div></div>';
  end.innerHTML=h;end.hidden=false;end.scrollTop=0;card.hidden=true;place();gUI.selectAll('*').remove();
  end.querySelectorAll('.gink').forEach(function(sv,k){var p=sv.parentNode,w=p.offsetWidth,hh=p.offsetHeight,d=d3.select(sv).attr('width',w).attr('height',hh);
    var pth=ink(d,rrect(rng(300+k),1.5,1.5,w-3,hh-3,0.8),INK,1.6);
    if(!RM){var L=pth.node().getTotalLength();pth.attr('stroke-dasharray',L+' '+L).attr('stroke-dashoffset',L).transition().delay(k*180).duration(800).attr('stroke-dashoffset',0);}});
  if(chart){try{chart.destroy();}catch(e){}chart=null;}
  if(nC&&window.Chart){
    try{chart=new Chart($('ft-chart'),{type:'doughnut',data:{labels:CHECKS.map(function(c){return c.t;}),datasets:[{data:CHECKS.map(function(){return 1;}),
      backgroundColor:CHECKS.map(function(c,k){return c.done?PAL[k%PAL.length]:'#e4e2de';}),borderColor:'#fffef8',borderWidth:4,hoverOffset:6}]},
      options:{responsive:false,maintainAspectRatio:false,cutout:'64%',cutoutPercentage:64,animation:RM?false:{animateRotate:true,animateScale:false,duration:1400},
      layout:{padding:0},legend:{display:false},
      plugins:{legend:{display:false},tooltip:{enabled:true,callbacks:{label:function(c){var ix=c.dataIndex!=null?c.dataIndex:c.index,it=CHECKS[ix]||{};return ' '+(c.label||it.t||'')+': '+(it.done?'done':'open');}}}}}});
      if(chart.options){if(chart.options.plugins&&chart.options.plugins.legend)chart.options.plugins.legend.display=false;if(chart.options.legend)chart.options.legend.display=false;}
      var cc=end.querySelector('.cc');if(cc&&chart.chartArea){var a=chart.chartArea;cc.style.left=((a.left+a.right)/2)+'px';cc.style.top=((a.top+a.bottom)/2)+'px';}
    }catch(e){console.warn('[flow-training] chart skipped',e);$('chartwrap').style.display='none';}
  }else if(nC){$('chartwrap').style.display='none';}
  setHash('done');update();try{end.focus({preventScroll:true});}catch(e){}
}
function hideEnd(){end.hidden=true;if(chart){try{chart.destroy();}catch(e){}chart=null;}renderPlus(0);openCard(last());}
end.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var a=b.getAttribute('data-e');if(a==='replay')replay();else if(a==='back')hideEnd();else if(a==='whole'){end.hidden=true;whole();}});

/* ---------- toolbar, keys, hash ---------- */
var dots=$('dots');for(var di=0;di<N;di++)dots.appendChild(document.createElement('i'));
function update(){
  var n=order.length,ds=dots.children;
  $('progtxt').textContent=(!end.hidden?'Done: ':'Step ')+n+' of '+N;
  for(var k=0;k<N;k++){ds[k].className=k<n-1?'on':(k===n-1?(end.hidden?'cur':'on'):'');}
  $('bBack').disabled=n<=1&&end.hidden;
  var a=actions()[0],b=$('bNext');
  b.textContent=a.finish?('Finish '+A):'Add step +';
  b.classList.toggle('locked',locked());b.disabled=!end.hidden;
}
$('bBack').addEventListener('click',back);
$('bNext').addEventListener('click',next);
$('bReplay').addEventListener('click',replay);
$('bWhole').addEventListener('click',whole);
$('bFit').addEventListener('click',fitAll);
document.addEventListener('keydown',function(e){
  var t=e.target,tag=t&&t.tagName;
  if(e.key==='ArrowRight'){if(tag==='INPUT'||tag==='TEXTAREA')return;e.preventDefault();next();}
  else if(e.key==='ArrowLeft'){if(tag==='INPUT'||tag==='TEXTAREA')return;e.preventDefault();back();}
  else if(e.key==='Escape'){toggleMin();}
});
function setHash(v){try{history.replaceState(null,'','#'+(v||('step='+order.length)));}catch(e){}}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(!card.hidden)inkCard();if(cardIdx>=0)focusRegion(region(cardIdx),0,cardIdx);else if(cardIdx===-2)fitAll();},150);});

var hs='';try{hs=location.hash||'';}catch(e){}
var m=/step=(\d+)/.exec(hs),want=hs.indexOf('done')>=0?N:(m?Math.max(1,Math.min(N,+m[1])):1);
if(want>1){
  var sq=seqAll().slice(0,want);
  sq.forEach(function(i,k){if(k<want-1||hs.indexOf('done')>=0)answered[i]={auto:true};order.push(i);drawStep(i,0);});
  update();renderPlus(0);openCard(last());
  if(hs.indexOf('done')>=0)showEnd();
}else{
  focusRegion(region(0),0);addStep(0);
}
window.__flowTraining={order:function(){return order.slice();},steps:function(){return N;},available:function(){return actions().map(function(a){return a.finish?'finish':a.i;});},next:next,back:back,add:function(i){doAct({i:i});},answer:function(k){if(cardIdx>=0&&S[cardIdx].quiz&&!answered[cardIdx])answer(cardIdx,k);},whole:whole,busy:function(){return Date.now()<busyUntil;},locked:locked,geom:function(){return geom?JSON.parse(JSON.stringify(geom)):null;},cardIdx:function(){return cardIdx;},gliding:function(){return !!glide;},open:function(i){openCard(i,true);},layout:function(){return S.map(function(s){return {id:s.id,x:s.x,y:s.y,box:s.box||null,conn:s.conn};});}};
}
})();
</script>
